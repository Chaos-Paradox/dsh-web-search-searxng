# E2E benchmark overlay for the searxng round: point the plugin at the local
# instance. The integrated host journals the default SearXNG route at install,
# so this overlay only carries the endpoint and prohibits paid fallback. Applied via
# `dsh --patch`; the profile's own files stay untouched.
- id: web-search-searxng
  config:
    allowOfficialFallback: false
    baseURL: http://127.0.0.1:8080
    # Must be engines this instance actually has registered — check /config.
    # Unknown names are silently dropped by SearXNG and the query falls back
    # to the instance's default engine set.
    engines: bing,yahoo
